<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Tienda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVEGACIÓN -->
  <header>
    <nav>
      <h1 class="logo">LOGO</h1>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Nosotros</a></li>
      </ul>
      <div class="carrito-icon">
        🛒 <span id="contador">0</span>
      </div>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h2>Nueva Colección</h2>
    <p>Estilo que habla por ti</p>
    <a href="#" class="btn">Ver productos</a>
  </section>

  <!-- CATEGORÍAS -->
<section class="categorias">
  <button class="cat-btn activa" data-categoria="todas">Todas</button>
  <button class="cat-btn" data-categoria="poleras">Poleras</button>
  <button class="cat-btn" data-categoria="abrigos">Abrigos</button>
</section>

  <!-- PRODUCTOS -->
  <section class="productos">
    <h2>Lo más vendido</h2>
    <div class="grid-productos">
      <!-- las tarjetas las genera el JS -->
    </div>
  </section>

  <!-- PANEL DEL CARRITO -->
  <div class="carrito-panel" id="carritoPanel">
    <div class="carrito-header">
      <h3>Tu carrito</h3>
      <span id="cerrarCarrito">✕</span>
    </div>
    <div class="carrito-items" id="carritoItems">
    </div>
    <div class="carrito-footer">
      <p>Total: <strong id="carritoTotal">S/ 0.00</strong></p>
      <a href="#" class="btn" id="btnFinalizar">Finalizar compra</a>
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- FOOTER -->
  <footer>
    <p>síguenos en TikTok · Instagram · WhatsApp</p>
    <p style="margin-top: 12px;">© 2025 Tu Tienda — Todos los derechos reservados</p>
  </footer>

  <script src="js/main.js"></script>
  <div class="notificacion" id="notificacion">✓ Agregado al carrito</div>
</body>
</html>
